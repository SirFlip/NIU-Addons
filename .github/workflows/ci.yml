name: Build und Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Userscript bauen
        run: python3 build.py
      - name: dist/ muss zum Quellstand passen
        run: git diff --exit-code --ignore-cr-at-eol -- dist/
      - name: Test-Build
        run: python3 build.py --test
      - name: Test-Abhängigkeiten
        run: cd test && npm i --no-audit --no-fund jsdom@24 fake-indexeddb@5
      - name: Tests
        run: cd test && node smoke.js && node behaviour.js && node lvstatistic.js
